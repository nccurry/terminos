name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Task
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.48.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Set up tools
        run: task setup

      - name: Run CI contract
        run: task ci
