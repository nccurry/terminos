name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Task
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.48.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build release artifacts
        run: |
          task release:local VERSION="${GITHUB_REF_NAME#v}"
          task release:check VERSION="${GITHUB_REF_NAME#v}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/release/* --generate-notes --verify-tag
